<defs>

    <!-- Arrow -->
    <marker id="arrow"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto"
            markerUnits="strokeWidth">

        <path d="M0,0 L12,6 L0,12 Z"
              fill="#2563eb"/>

    </marker>


    <!-- Shadow -->
    <filter id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">

        <feDropShadow
            dx="0"
            dy="5"
            stdDeviation="7"
            flood-color="#0f172a"
            flood-opacity="0.12"/>

    </filter>


    <!-- Background gradient -->
    <linearGradient id="backgroundGradient"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

        <stop offset="0%"
              stop-color="#f8fafc"/>

        <stop offset="100%"
              stop-color="#eef2ff"/>

    </linearGradient>


    <!-- Header gradient -->
    <linearGradient id="headerGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

        <stop offset="0%"
              stop-color="#1e3a8a"/>

        <stop offset="100%"
              stop-color="#2563eb"/>

    </linearGradient>


    <!-- Module gradients -->

    <linearGradient id="inputGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

        <stop offset="0%"
              stop-color="#dbeafe"/>

        <stop offset="100%"
              stop-color="#bfdbfe"/>

    </linearGradient>


    <linearGradient id="privacyGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

        <stop offset="0%"
              stop-color="#dcfce7"/>

        <stop offset="100%"
              stop-color="#bbf7d0"/>

    </linearGradient>


    <linearGradient id="classificationGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

        <stop offset="0%"
              stop-color="#ede9fe"/>

        <stop offset="100%"
              stop-color="#ddd6fe"/>

    </linearGradient>


    <linearGradient id="indicatorGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

        <stop offset="0%"
              stop-color="#fef3c7"/>

        <stop offset="100%"
              stop-color="#fde68a"/>

    </linearGradient>


    <linearGradient id="correlationGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

        <stop offset="0%"
              stop-color="#fee2e2"/>

        <stop offset="100%"
              stop-color="#fecaca"/>

    </linearGradient>


    <linearGradient id="dashboardGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

        <stop offset="0%"
              stop-color="#cffafe"/>

        <stop offset="100%"
              stop-color="#a5f3fc"/>

    </linearGradient>

</defs>


