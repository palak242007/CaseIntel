<defs>

    <!-- =====================================================
         ARROW MARKERS
    ====================================================== -->

    <marker id="arrowBlue"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto"
            markerUnits="strokeWidth">

        <path d="M0,0 L12,6 L0,12 Z"
              fill="#2563eb"/>

    </marker>


    <marker id="arrowGreen"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto"
            markerUnits="strokeWidth">

        <path d="M0,0 L12,6 L0,12 Z"
              fill="#16a34a"/>

    </marker>


    <marker id="arrowPurple"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto"
            markerUnits="strokeWidth">

        <path d="M0,0 L12,6 L0,12 Z"
              fill="#7c3aed"/>

    </marker>


    <!-- =====================================================
         SHADOW
    ====================================================== -->

    <filter id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">

        <feDropShadow
            dx="0"
            dy="5"
            stdDeviation="7"
            flood-color="#0f172a"
            flood-opacity="0.13"/>

    </filter>


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <linearGradient id="background"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

        <stop offset="0%"
              stop-color="#f8fafc"/>

        <stop offset="100%"
              stop-color="#eef2ff"/>

    </linearGradient>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <linearGradient id="header"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

        <stop offset="0%"
              stop-color="#172554"/>

        <stop offset="50%"
              stop-color="#1d4ed8"/>

        <stop offset="100%"
              stop-color="#2563eb"/>

    </linearGradient>


    <!-- =====================================================
         FRONTEND GRADIENT
    ====================================================== -->

    <linearGradient id="frontendGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

        <stop offset="0%"
              stop-color="#dbeafe"/>

        <stop offset="100%"
              stop-color="#bfdbfe"/>

    </linearGradient>


    <!-- =====================================================
         INTEGRATION GRADIENT
    ====================================================== -->

    <linearGradient id="integrationGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

        <stop offset="0%"
              stop-color="#cffafe"/>

        <stop offset="100%"
              stop-color="#a5f3fc"/>

    </linearGradient>


    <!-- =====================================================
         MODULE GRADIENT
    ====================================================== -->

    <linearGradient id="moduleGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

        <stop offset="0%"
              stop-color="#ffffff"/>

        <stop offset="100%"
              stop-color="#f8fafc"/>

    </linearGradient>


    <!-- =====================================================
         STORAGE GRADIENT
    ====================================================== -->

    <linearGradient id="storageGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

        <stop offset="0%"
              stop-color="#fef3c7"/>

        <stop offset="100%"
              stop-color="#fde68a"/>

    </linearGradient>


    <!-- =====================================================
         INVESTIGATOR GRADIENT
    ====================================================== -->

    <linearGradient id="investigatorGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

        <stop offset="0%"
              stop-color="#dcfce7"/>

        <stop offset="100%"
              stop-color="#bbf7d0"/>

    </linearGradient>

</defs>


