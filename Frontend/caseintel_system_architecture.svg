<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1500"
     height="1050"
     viewBox="0 0 1500 1050">

  <defs>

    <!-- Background -->
    <linearGradient id="backgroundGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>

    <!-- Header -->
    <linearGradient id="headerGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Layer gradients -->
    <linearGradient id="inputGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>

    <linearGradient id="privacyGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>

    <linearGradient id="aiGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>

    <linearGradient id="intelGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <linearGradient id="dataGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <linearGradient id="dashboardGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>

    <linearGradient id="outputGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">

      <feDropShadow
          dx="0"
          dy="5"
          stdDeviation="7"
          flood-color="#000000"
          flood-opacity="0.16"/>

    </filter>

    <!-- Normal arrow -->
    <marker id="arrow"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto">

      <path
          d="M0,0 L12,6 L0,12 Z"
          fill="#475569"/>

    </marker>

    <!-- Blue arrow -->
    <marker id="blueArrow"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto">

      <path
          d="M0,0 L12,6 L0,12 Z"
          fill="#2563eb"/>

    </marker>

    <!-- Green arrow -->
    <marker id="greenArrow"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto">

      <path
          d="M0,0 L12,6 L0,12 Z"
          fill="#16a34a"/>

    </marker>

  </defs>


